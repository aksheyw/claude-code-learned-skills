<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="440" fill="#FFFFFF"/>

  <text x="40" y="38" font-size="15" font-weight="600" fill="#5B6169">How a skill gets written here</text>

  <!-- Step 1: the trigger -->
  <rect x="40" y="62" width="196" height="104" rx="10" fill="#FDF6F5" stroke="#E8D5D2" stroke-width="1.5"/>
  <text x="58" y="90" font-size="12" font-weight="700" fill="#B42318">THE TRIGGER</text>
  <text x="58" y="116" font-size="14.5" fill="#5C4A47">A bug eats more</text>
  <text x="58" y="136" font-size="14.5" fill="#5C4A47">than 20 minutes of</text>
  <text x="58" y="156" font-size="14.5" fill="#5C4A47">a working session.</text>

  <path d="M244 114 L282 114" stroke="#B9BEC6" stroke-width="2" fill="none"/>
  <path d="M282 114 l-8 -5 v10 z" fill="#B9BEC6"/>

  <!-- Step 2: distil -->
  <rect x="290" y="62" width="212" height="104" rx="10" fill="#F3F5F9" stroke="#B9BEC6" stroke-width="1.5"/>
  <text x="308" y="90" font-size="12" font-weight="700" fill="#1B2A4A">AT SESSION END</text>
  <text x="308" y="116" font-size="14.5" fill="#1B2A4A">Write down the symptoms,</text>
  <text x="308" y="136" font-size="14.5" fill="#1B2A4A">the root cause, the exact</text>
  <text x="308" y="156" font-size="14.5" fill="#1B2A4A">fix, and a checklist.</text>

  <path d="M510 114 L548 114" stroke="#B9BEC6" stroke-width="2" fill="none"/>
  <path d="M548 114 l-8 -5 v10 z" fill="#B9BEC6"/>

  <!-- Step 3: save -->
  <rect x="556" y="62" width="180" height="104" rx="10" fill="#F5F6F7" stroke="#B9BEC6" stroke-width="1.5"/>
  <text x="574" y="90" font-size="12" font-weight="700" fill="#1B2A4A">SAVE IT AS</text>
  <text x="574" y="118" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1B2A4A">~/.claude/skills/</text>
  <text x="574" y="138" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1B2A4A">&lt;name&gt;/SKILL.md</text>
  <text x="574" y="158" font-size="12.5" fill="#8A8F98">one file, copy it in</text>

  <path d="M744 114 L782 114" stroke="#0E9384" stroke-width="2" fill="none"/>
  <path d="M782 114 l-8 -5 v10 z" fill="#0E9384"/>

  <!-- Step 4: payoff -->
  <rect x="790" y="62" width="170" height="104" rx="10" fill="#E6F4F1" stroke="#0E9384" stroke-width="1.5"/>
  <text x="808" y="90" font-size="12" font-weight="700" fill="#0B6E5F">EVERY SESSION AFTER</text>
  <text x="808" y="116" font-size="14.5" fill="#0B6E5F">Claude Code loads it</text>
  <text x="808" y="136" font-size="14.5" fill="#0B6E5F">by itself when the</text>
  <text x="808" y="156" font-size="14.5" fill="#0B6E5F">task matches.</text>

  <!-- return loop -->
  <path d="M875 172 L875 206 L138 206 L138 174" stroke="#0E9384" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <path d="M138 172 l-5 8 h10 z" fill="#0E9384"/>
  <rect x="392" y="192" width="228" height="28" rx="6" fill="#FFFFFF"/>
  <text x="506" y="211" font-size="13.5" font-weight="600" fill="#0B6E5F" text-anchor="middle">the same gotcha, second time</text>

  <line x1="40" y1="248" x2="920" y2="248" stroke="#E3E6EB" stroke-width="1"/>

  <!-- inventory -->
  <text x="40" y="282" font-size="15" font-weight="600" fill="#5B6169">What is in the library today: twelve skills</text>

  <rect x="40" y="298" width="168" height="62" rx="8" fill="#F3F5F9" stroke="#B9BEC6" stroke-width="1"/>
  <text x="58" y="323" font-size="22" font-weight="700" fill="#1B2A4A">3</text>
  <text x="82" y="323" font-size="13.5" fill="#1B2A4A">Docker, SSH</text>
  <text x="58" y="345" font-size="13.5" fill="#5B6169">and remote servers</text>

  <rect x="220" y="298" width="168" height="62" rx="8" fill="#F3F5F9" stroke="#B9BEC6" stroke-width="1"/>
  <text x="238" y="323" font-size="22" font-weight="700" fill="#1B2A4A">2</text>
  <text x="262" y="323" font-size="13.5" fill="#1B2A4A">Data and machine</text>
  <text x="238" y="345" font-size="13.5" fill="#5B6169">learning pipelines</text>

  <rect x="400" y="298" width="168" height="62" rx="8" fill="#F3F5F9" stroke="#B9BEC6" stroke-width="1"/>
  <text x="418" y="323" font-size="22" font-weight="700" fill="#1B2A4A">4</text>
  <text x="442" y="323" font-size="13.5" fill="#1B2A4A">Field guides to</text>
  <text x="418" y="345" font-size="13.5" fill="#5B6169">prompting AI models</text>

  <rect x="580" y="298" width="168" height="62" rx="8" fill="#F3F5F9" stroke="#B9BEC6" stroke-width="1"/>
  <text x="598" y="323" font-size="22" font-weight="700" fill="#1B2A4A">2</text>
  <text x="622" y="323" font-size="13.5" fill="#1B2A4A">Finding bugs and</text>
  <text x="598" y="345" font-size="13.5" fill="#5B6169">organising docs</text>

  <rect x="760" y="298" width="160" height="62" rx="8" fill="#E6F4F1" stroke="#0E9384" stroke-width="1"/>
  <text x="778" y="323" font-size="22" font-weight="700" fill="#0B6E5F">1</text>
  <text x="802" y="323" font-size="13.5" fill="#0B6E5F">A project wiki</text>
  <text x="778" y="345" font-size="13.5" fill="#0B6E5F">that outlives sessions</text>

  <rect x="40" y="374" width="880" height="30" rx="6" fill="#E6F4F1"/>
  <text x="56" y="394" font-size="14.5" font-weight="600" fill="#0B6E5F">That last one is the most used: it runs in 16 of my projects, and the biggest of those wikis is 358 pages.</text>
  <text x="40" y="422" font-size="13" fill="#8A8F98">Every skill is plain markdown. No dependencies, no build step.</text>
</svg>
